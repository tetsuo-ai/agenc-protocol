name: Cutover endpoint timing (temporary branch only)
on:
  push:
    branches: [release-dry-run/rev9-diag]
permissions:
  contents: read
jobs:
  timing:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Time OtterSec and the cutover itself from a hosted runner
        shell: bash
        run: |
          set +e
          P=HJsZ53Zb27b8QMRbQpuDngE44AdwCGxvEZr61Zmxw1xK
          echo "runner ip: $(curl -s --max-time 10 https://api.ipify.org)"
          for t in 1 2 3 4 5; do curl -s -o /tmp/o.json -w "osec status-all try$t: %{http_code} ttfb=%{time_starttransfer}s total=%{time_total}s %{size_download}B\n" --max-time 40 -H 'accept: application/json' https://verify.osec.io/status-all/$P; head -c 200 /tmp/o.json; echo; done
          curl -s -o /dev/null -w "npm registry: %{http_code} %{time_total}s\n" --max-time 30 https://registry.npmjs.org/@tetsuo-ai%2fprotocol
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with:
          persist-credentials: false
      - name: Run the real cutover gate three times with per-call timing
        shell: bash
        env:
          AGENC_MAINNET_RPC_URLS_JSON: '["https://api.mainnet-beta.solana.com","https://solana-rpc.publicnode.com"]'
          EXPECTED_MAINNET_PROGRAM_SHA256: baf5be55c86f0a5c79eb52229a3412121a1a3c5f2a5699f4b24d75c7e8dc3608
          EXPECTED_VERIFIED_SOURCE_COMMIT: 154d286659592c799bd111bf416fdba7ccc704b4
        run: |
          set +e
          cat > /tmp/timing.mjs <<'JS'
          const orig = globalThis.fetch;
          globalThis.fetch = async (url, init) => { const t = Date.now(); try { const r = await orig(url, init); console.error(`fetch ${String(url).slice(0,70)} -> ${r.status} in ${Date.now()-t} ms`); return r; } catch (e) { console.error(`fetch ${String(url).slice(0,70)} FAILED after ${Date.now()-t} ms: ${e.name}`); throw e; } };
          JS
          for t in 1 2 3; do echo "== cutover try $t"; node --import /tmp/timing.mjs scripts/release-policy.mjs cutover; echo "exit $?"; done
