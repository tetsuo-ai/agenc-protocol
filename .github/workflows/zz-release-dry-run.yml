        attempt:
          - a
        include:
          - tag: sdk-v0.14.0
            attempt: b
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
